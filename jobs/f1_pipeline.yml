resources:
  jobs:
    f1_pipeline:
      name: f1_pipeline
      email_notifications:
        on_failure:
          - <email>
      schedule:
        quartz_cron_expression: 0 0 8 ? * Mon
        timezone_id: Europe/Oslo
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze_circuits
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/bronze/bronze_circuits
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 0
          disable_auto_optimization: false
        - task_key: bronze_constructors
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/bronze/bronze_constructors
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 0
          disable_auto_optimization: false
        - task_key: bronze_drivers
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/bronze/bronze_drivers
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 0
          disable_auto_optimization: false
        - task_key: bronze_races
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/bronze/bronze_races
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 0
          disable_auto_optimization: false
        - task_key: bronze_results
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/bronze/bronze_results
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 0
          disable_auto_optimization: false
        - task_key: silver_circuits
          depends_on:
            - task_key: bronze_circuits
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/silver/silver_circuits
            source: WORKSPACE
        - task_key: dim_circuits
          depends_on:
            - task_key: silver_circuits
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/gold/dim_circuits
            source: WORKSPACE
        - task_key: silver_constructors
          depends_on:
            - task_key: bronze_constructors
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/silver/silver_constructors
            source: WORKSPACE
        - task_key: dim_constructors
          depends_on:
            - task_key: silver_constructors
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/gold/dim_constructors
            source: WORKSPACE
        - task_key: silver_drivers
          depends_on:
            - task_key: bronze_drivers
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/silver/silver_drivers
            source: WORKSPACE
        - task_key: silver_races
          depends_on:
            - task_key: bronze_races
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/silver/silver_races
            source: WORKSPACE
        - task_key: dim_races
          depends_on:
            - task_key: silver_races
            - task_key: silver_circuits
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/gold/dim_races
            source: WORKSPACE
        - task_key: silver_results
          depends_on:
            - task_key: bronze_results
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/silver/silver_results
            source: WORKSPACE
        - task_key: dim_drivers
          depends_on:
            - task_key: silver_drivers
            - task_key: silver_results
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/gold/dim_drivers
            source: WORKSPACE
        - task_key: fact_results
          depends_on:
            - task_key: dim_races
            - task_key: dim_constructors
            - task_key: dim_drivers
            - task_key: silver_results
          notebook_task:
            notebook_path: /Workspace/Users/<email>/F1-Databricks-Project/notebooks/gold/fact_results
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: STANDARD